<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <!-- Escribe tus etiquetas (label) e inputs aquí -->
                <h1>Crear Cuenta</h1>

                <div>
                    <label for="nombre">Nombre completo: </label>
                    <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="ej. Ori Beltran"
                            required
                            minlength="3"
                            maxlength="100"

                    >
                </div>

                <div>
                    <label for="correo">correo: </label>
                    <input type="email"
                           id="correo"
                           name="correo"
                           placeholder="ori@gmail.com"
                           minlength="5"
                           maxlength="100"
                    >

                </div>

                <div>
                    <label for="password">Password: </label>
                    <input type="Password"
                           id="password"
                           name="password"
                           placeholder="******"
                           minlength="5"
                           maxlength="100"
                           autocomplete="off"

                    >
                </div>

                <div>
                    <label for="pseudonimo"> Pseudonimo: </label>
                    <input type="text"
                           id="pseudonimo"
                           name="pseudonimo"
                           required
                           pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                           placeholder="Nebula-2026"
                           minlength="6"
                           min="3"

                    >
                </div>
                <div>
                    <label>Genero: </label>
                    <input
                      type="radio"
                      id="rad_femenino"
                      name="genero"
                      value="femenino"
                      required
                    >
                    <label for="rad_femenino">Femenino</label>
                    <input
                            type="radio"
                            id="rad_masculino"
                            name="genero"
                            value="masculino"

                            >
                    <label for="rad_masculino">Masculino</label>

                    <input
                            type="radio"
                            id="rad_otro"
                            name="genero"
                            value="otro"

                    >
                    <label for="rad_otro">Otro</label>

                </div>

                <div>
                    <label for="suscripcion">Tipo de Suscripcion</label>
                    <select name="suscripcion" id="suscripcion" required>
                        <option value="">----- Selecciona una opcion -----</option>
                        <option value="">Gratis (con anuncios)</option>
                        <option value="">Premiun Mensual ($99/mes)</option>
                        <option value="">Premiun Anual ($899/year)</option>
                    </select>
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input
                            type="date"
                            id="fechaNacimiento"
                            name="fechaNacimiento"
                            required


                    >
                </div>

                <div>
                    <input type="checkbox" id="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los terminos y condiciones de uso</label>
                </div>

                <div>
                    <label for="comentarios">Comentarios</label>
                    <textarea name="comentarios"
                              id="comentarios"
                              cols="30"
                              rows="10"
                              placeholder="Cuentanos que musica te gusta"
                    >

                    </textarea>
                </div>
                <div>
                    <button type="submit">
                        Crear cuenta
                    </button>

                    <button type="reset">
                        Limpiar Formulario
                    </button>

                    <p> Ya tienes cuenta? <a href="iniciar-sesion.html"> Iniciar Sesion</a></p>

                </div>

            </form>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
