<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <header class="auth-header">
                <a href="/index"><img src="/imgs/nebula-03.svg" alt="Nébula Music, ir al inicio"></a>
                <h1>Crear Cuenta</h1>
                <p>Completa los datos para registrarte</p>
            </header>
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Ori Beltran" required minlength="3" maxlength="100" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required minlength="5" maxlength="100" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8" maxlength="100" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="pseudonimo">Pseudónimo</label>
                    <input type="text" id="pseudonimo" name="pseudonimo" placeholder="Nebula-2026" required pattern="[a-zA-Z]{3,10}-[0-9]{2,10}" minlength="6" title="De 3 a 10 letras, un guion y de 2 a 10 números">
                </div>
                <fieldset class="form-group">
                    <legend>Género</legend>
                    <div class="radio-group">
                        <label for="rad_femenino"><input type="radio" id="rad_femenino" name="genero" value="femenino" required> Femenino</label>
                        <label for="rad_masculino"><input type="radio" id="rad_masculino" name="genero" value="masculino"> Masculino</label>
                        <label for="rad_otro"><input type="radio" id="rad_otro" name="genero" value="otro"> Otro</label>
                    </div>
                </fieldset>
                <div class="form-group">
                    <label for="suscripcion">Tipo de Suscripción</label>
                    <select name="suscripcion" id="suscripcion" required>
                        <option value="">Selecciona una opción</option>
                        <option value="gratis">Gratis (con anuncios)</option>
                        <option value="premium_mensual">Premium Mensual ($99/mes)</option>
                        <option value="premium_anual">Premium Anual ($899/año)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de Nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required autocomplete="bday">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los términos y condiciones de uso</label>
                </div>
                <div class="form-group">
                    <label for="comentarios">Comentarios</label>
                    <textarea name="comentarios" id="comentarios" rows="4" placeholder="Cuéntanos qué música te gusta"></textarea>
                </div>
                <button type="submit" class="btn-primary">Crear Cuenta</button>
                <button type="reset" class="btn-secondary">Limpiar Formulario</button>
            </form>
            <p class="auth-link">¿Ya tienes cuenta? <a href="/iniciar-sesion">Inicia sesión</a></p>
        </section>
    </main>
    <footer>
        <p>Copyright &copy; Nébula Music 2025. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
