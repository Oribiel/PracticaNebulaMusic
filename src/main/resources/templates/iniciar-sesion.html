<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <header class="auth-header">
                <a href="/index"><img src="/imgs/nebula-03.svg" alt="Nébula Music, ir al inicio"></a>
                <h1>Inicia Sesión</h1>
                <p>Ingresa tus credenciales de acceso</p>
            </header>
            <form method="post" action="/autentation" enctype="application/x-www-form-urlencoded">
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required minlength="5" maxlength="100" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********" required minlength="8" maxlength="100" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <button type="reset" class="btn-secondary">Cancelar</button>
            </form>
            <p class="auth-link">¿Aún no tienes cuenta? <a href="/registro">Regístrate</a></p>
        </section>
    </main>
    <footer>
        <p>Copyright &copy; Nébula Music 2025. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
