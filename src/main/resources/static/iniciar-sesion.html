<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <form method="post" action="/autentation" enctype="application/x-www-form-urlencoded">

                <h1>Inicio de Sesion</h1>
                <div>
                    <label for="correo">
                        Correo Electronico

                    </label>
                    <input type="email"
                           id="correo"
                           name="correo"
                           placeholder="correo@ejemplo.com"
                           required
                           minlength="5"
                           maxlength="100"
                    >
                </div>

                <div>
                    <label for="Password">
                        Password

                    </label>
                    <input type="password"
                           id="Password"
                           name="Password"
                           placeholder="*********"
                           required
                           minlength="8"
                           maxlength="100"
                           >

                </div>

                <div>
                    <button type="submit">
                        Iniciar Sesion
                    </button>

                    <button type="reset">
                        Limpiar Formulario
                    </button>

                </div>

            </form>

            <p> Aun no tienes cuenta? <a href="registro.html"> Registrate aqui</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
